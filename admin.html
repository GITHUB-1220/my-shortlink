
<!doctype html><html><head><meta charset="utf-8"><title>Admin</title></head>
<body>
<h2>短链后台</h2>
<p>短码：<input id="code"></p>
<p>目标网址：<input id="url" size="60"></p>
<p>有效天数：<input id="days" value="7"></p>
<button onclick="create()">创建</button>
<pre id="out"></pre>
<script>
async function create(){
 const r=await fetch('/api/create',{method:'POST',headers:{'content-type':'application/json'},
 body:JSON.stringify({
  code:code.value,url:url.value,days:Number(days.value)
 })});
 out.textContent=await r.text();
}
</script>
</body></html>
